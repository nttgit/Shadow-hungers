<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Săn Bóng Tối</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js" onerror="window.__mqttFail=true"></script>
<style>
  :root{--bg:#0f0e17;--panel:#1a1825;--panel2:#242134;--line:#352f4d;--accent:#e63946;--gold:#f4a261;--text:#f2f2f2;--muted:#9a95ab;--hunter:#4ea8de;--shadow:#e63946;--neutral:#9b5de5;--green:#2ecc71;color-scheme:dark;}
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0;background:radial-gradient(circle at 50% 0%,#241f38,#0f0e17 60%);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px));line-height:1.4;}
  h1{font-size:1.3rem;text-align:center;margin:2px 0 0;letter-spacing:2px;color:var(--gold);}
  .sub{text-align:center;color:var(--muted);font-size:.76rem;margin-bottom:8px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px;}
  .card.private{border-color:var(--green);background:#13211b;}
  .card.turn{border-color:var(--gold);}
  input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid #3d3757;background:var(--panel2);color:var(--text);font-size:1rem;margin-top:6px;}
  button{border:none;border-radius:10px;padding:11px 13px;font-size:.92rem;font-weight:600;cursor:pointer;margin:4px 4px 4px 0;transition:transform .1s;font-family:inherit;}
  button:active{transform:scale(.96);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .btn-main{background:linear-gradient(135deg,var(--accent),#b5202b);color:#fff;width:100%;}
  .btn-gold{background:var(--gold);color:#241a0a;width:100%;}
  .btn-blue{background:#2b6cb0;color:#fff;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid #443e63;}
  .btn-target{background:#3a1622;color:#ffb4b4;border:1px solid var(--accent);}
  .btn-heal{background:#123a2a;color:#9ff0d6;border:1px solid var(--green);}
  .btn-sm{padding:6px 10px;font-size:.78rem;margin:2px;}
  .row{display:flex;flex-wrap:wrap;gap:4px;}
  .between{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .pill{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;background:var(--panel2);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:.88rem;}
  .pill.dead{opacity:.5;}
  .tag{font-size:.62rem;padding:2px 7px;border-radius:20px;font-weight:700;white-space:nowrap;}
  .tag-hunter{background:var(--hunter);color:#04263e;}.tag-shadow{background:var(--shadow);color:#3d0006;}.tag-neutral{background:var(--neutral);color:#1e0730;}.tag-you{background:var(--gold);color:#241a0a;}
  .muted{color:var(--muted);font-size:.8rem;}
  .small{font-size:.74rem;}
  .log{max-height:170px;overflow-y:auto;font-size:.8rem;color:#c9c3e0;background:#161320;border-radius:10px;padding:8px 10px;}
  .log div{margin-bottom:3px;}
  .center{text-align:center;}
  .role-badge{font-size:1rem;font-weight:800;text-align:center;padding:9px;border-radius:12px;margin-bottom:6px;color:#fff;}
  #status{font-size:.72rem;text-align:center;color:var(--muted);margin-bottom:6px;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
  .dot-on{background:var(--green);}.dot-off{background:var(--accent);}.dot-wait{background:var(--gold);}
  .area-card{background:var(--panel2);border:1px dashed #3a3452;border-radius:10px;padding:8px 10px;margin-top:6px;}
  .area-card.here{border:1px solid var(--gold);background:#2a2236;}
  .zone-tag{font-size:.68rem;color:var(--gold);font-weight:700;margin-bottom:2px;}
  .chip{display:inline-block;background:#2f2a44;border:1px solid #4a4370;color:#e8e4f5;border-radius:14px;padding:2px 9px;font-size:.72rem;margin:2px 3px 2px 0;cursor:pointer;}
  .chip:active{background:#3f3860;}
  .hpbar{height:8px;border-radius:6px;background:#3a3550;overflow:hidden;margin:6px 0 2px;}
  .hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#a8e063);}
  .steps{display:flex;gap:4px;margin-bottom:8px;}
  .steps span{flex:1;text-align:center;font-size:.7rem;padding:5px 2px;border-radius:8px;background:#201c2e;color:var(--muted);}
  .steps span.on{background:var(--gold);color:#241a0a;font-weight:700;}
  .steps span.done{background:#2a3a2f;color:#9ff0d6;}
  .cardbox{background:#0f1a14;border:1px solid var(--green);border-radius:10px;padding:9px 11px;margin:6px 0;font-size:.86rem;}
  .cardbox b{color:#9ff0d6;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
  .modal[hidden]{display:none;}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));}
  .modal-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel);padding-bottom:6px;}
  .modal h3{font-size:.95rem;color:var(--gold);margin:12px 0 4px;}
  .modal p{margin:3px 0;font-size:.82rem;}
  .toast{pointer-events:auto;max-width:520px;width:100%;background:#241f38;border:1px solid var(--gold);border-radius:14px;padding:9px 13px;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:toastIn .2s ease;cursor:pointer;font-size:.84rem;color:#e8e4f5;}
  .toast.green{border-color:var(--green);background:#13211b;}
  @keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){.toast{animation:none;}button{transition:none;}}
</style>
</head>
<body>
<h1>🌘 SĂN BÓNG TỐI</h1>
<div class="sub">Theo luật Shadow Hunters · 4–8 người · chơi trên điện thoại</div>
<div id="syncBanner" style="display:none;background:#4a1620;border:1px solid var(--accent);color:#ffb4b4;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:.82rem;text-align:center;">
  ⚠️ Chưa kết nối được máy chủ đồng bộ. Kiểm tra mạng, hoặc host file ở nơi bình thường (Vercel/Netlify) rồi mở link đó.
</div>
<div id="status"><span class="dot dot-wait"></span>Đang kết nối…</div>
<div id="nameScreen">
  <div class="card">
    <p class="muted" style="margin:0;">Nhập tên và mã phòng. Cả nhóm dùng chung một mã phòng (3–8 chữ/số).</p>
    <input id="nameInput" type="text" maxlength="16" placeholder="Tên của bạn" autocomplete="off" autocorrect="off" autocapitalize="off">
    <input id="roomInput" type="text" maxlength="8" placeholder="Mã phòng, ví dụ: ABC123" autocomplete="off" autocorrect="off" autocapitalize="characters">
    <button class="btn-main" id="joinBtn" style="margin-top:10px;">Vào phòng</button>
    <button class="btn-ghost" id="rulesBtn0" style="width:100%;margin-top:6px;">📖 Xem luật và thẻ</button>
  </div>
</div>
<div id="app" style="display:none;"></div>
<div id="toastStack" style="position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:100;padding:0 12px;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;"></div>
<div id="modal" class="modal" hidden><div class="modal-box"><div class="modal-head"><b id="modalTitle"></b><button class="btn-ghost btn-sm" id="modalClose">✕ Đóng</button></div><div id="modalBody"></div></div></div>

<script>
// ================= DỮ LIỆU THEO LUẬT GỐC =================
const CHARACTERS={
  emi:{name:'Emi',faction:'hunter',hp:10,power:'Dịch chuyển: khi di chuyển, thay vì tung xúc xắc có thể đi tới khu cặp với khu đang đứng, hoặc khu đối diện ở cặp kế bên.'},
  franklin:{name:'Franklin',faction:'hunter',hp:12,power:'Sét đánh: 1 lần/ván, đầu lượt (trước khi tung di chuyển), chọn 1 người và tung d6 — người đó chịu sát thương bằng số tung.'},
  george:{name:'George',faction:'hunter',hp:14,power:'Phá hủy: 1 lần/ván, đầu lượt (trước khi tung di chuyển), chọn 1 người và tung d4 — người đó chịu sát thương bằng số tung.'},
  vampire:{name:'Vampire',faction:'shadow',hp:13,power:'Hút máu: khi đòn tấn công của bạn gây sát thương, hồi ngay 2 máu.'},
  werewolf:{name:'Werewolf',faction:'shadow',hp:14,power:'Phản đòn: sau khi bị tấn công (trúng hay trượt) được phản đòn ngay người đó. Phải lộ diện từ trước thì game mới hỏi.'},
  wight:{name:'Wight',faction:'shadow',hp:14,power:'Nhân bản: 1 lần/ván, lúc kết thúc lượt, được thêm số lượt bằng số người đã chết tại thời điểm đó.'},
  allie:{name:'Allie',faction:'neutral',hp:8,power:'Tình mẫu tử: 1 lần/ván, hồi đầy máu. Dùng được bất cứ lúc nào.'},
  bob:{name:'Bob',faction:'neutral',hp:10,power:'Cướp bóc: khi đòn đánh sẽ gây từ 2 sát thương, có thể cướp 1 trang bị (tự chọn) của nạn nhân thay vì gây sát thương.'},
  charles:{name:'Charles',faction:'neutral',hp:11,power:'Tiệc máu: sau khi tấn công, có thể tự chịu 2 sát thương để đánh lại đúng người đó (lặp lại được).'},
  daniel:{name:'Daniel',faction:'neutral',hp:13,power:'Thét: khi có người khác chết, bạn tự động lộ diện. Không được tự lộ diện lúc khác.'},
};
const WINCOND={
  emi:'Toàn bộ phe Bóng Tối chết.',franklin:'Toàn bộ phe Bóng Tối chết.',george:'Toàn bộ phe Bóng Tối chết.',
  vampire:'Toàn bộ phe Thợ Săn chết, HOẶC 3 người Trung Lập chết.',werewolf:'Toàn bộ phe Thợ Săn chết, HOẶC 3 người Trung Lập chết.',wight:'Toàn bộ phe Thợ Săn chết, HOẶC 3 người Trung Lập chết.',
  allie:'Còn sống khi ván kết thúc.',
  bob:'Sở hữu từ 5 trang bị trở lên.',
  charles:'Đòn tấn công của bạn hạ gục 1 người, và tính cả người đó thì tổng số người chết từ 3 trở lên.',
  daniel:'Là người chết đầu tiên, HOẶC còn sống khi toàn bộ Bóng Tối chết.',
};
const HUNTER_POOL=['emi','franklin','george'],SHADOW_POOL=['vampire','werewolf','wight'],NEUTRAL_POOL=['allie','bob','charles','daniel'];
const ALLOC={4:[2,2,0],5:[2,2,1],6:[2,2,2],7:[2,2,3],8:[3,3,2]};

const AREAS={
  hermit:{name:'Nhà Ẩn Sĩ',nums:[2,3],desc:'Rút 1 thẻ Ẩn Sĩ, đọc kín rồi đưa cho 1 người khác.'},
  gate:{name:'Cổng Địa Ngục',nums:[4,5],desc:'Chọn 1 trong 3 bộ (Trắng, Đen, Ẩn Sĩ) để rút.'},
  church:{name:'Nhà Thờ',nums:[6],desc:'Rút 1 thẻ Trắng.'},
  cemetery:{name:'Nghĩa Trang',nums:[8],desc:'Rút 1 thẻ Đen.'},
  woods:{name:'Rừng Quái Dị',nums:[9],desc:'Gây 2 sát thương cho 1 người, hoặc hồi 1 máu cho 1 người (kể cả bạn).'},
  altar:{name:'Bàn Thờ Cổ',nums:[10],desc:'Cướp 1 trang bị (tự chọn) của 1 người.'},
};
const AREA_IDS=Object.keys(AREAS);
function numToArea(n){for(const id of AREA_IDS){if(AREAS[id].nums.includes(n))return id;}return null;}

// Thẻ Trắng / Đen: type 'equip' (trang bị, để ngửa) hoặc 'single' (dùng 1 lần)
const CARDS={
  advent:{deck:'white',type:'single',name:'Giáng Thế',desc:'Nếu bạn là Thợ Săn, có thể lộ diện. Nếu lộ, hồi đầy máu.'},
  blessing:{deck:'white',type:'single',name:'Ban Phước',desc:'Chọn 1 người khác và tung d6: người đó hồi số máu bằng số tung.'},
  chocolate:{deck:'white',type:'single',name:'Sô-cô-la',desc:'Nếu bạn là Allie hoặc Emi, có thể lộ diện. Nếu lộ, hồi đầy máu.'},
  concealed:{deck:'white',type:'single',name:'Tri Thức Giấu Kín',desc:'Sau lượt này bạn được chơi thêm 1 lượt.'},
  mirror:{deck:'white',type:'single',name:'Gương Giải Trừ',desc:'Nếu bạn là Vampire, Werewolf hoặc Wight, bạn buộc phải lộ diện.'},
  firstaid:{deck:'white',type:'single',name:'Sơ Cứu',desc:'Đặt sát thương của 1 người (kể cả bạn) về đúng 7.'},
  flare:{deck:'white',type:'single',name:'Ánh Sáng Phán Xét',desc:'Tất cả người khác chịu 2 sát thương.'},
  brooch:{deck:'white',type:'equip',name:'Trâm May Mắn',desc:'Bạn không mất máu vì Rừng Quái Dị.'},
  guardian:{deck:'white',type:'single',name:'Thiên Thần Hộ Mệnh',desc:'Bạn không chịu sát thương từ đòn tấn công cho tới lượt kế tiếp của bạn.'},
  holyrobe:{deck:'white',type:'equip',name:'Áo Thánh',desc:'Đòn tấn công của bạn gây ít hơn 1 sát thương; sát thương bạn nhận từ đòn tấn công giảm 1.'},
  holywater:{deck:'white',type:'single',name:'Nước Thánh',desc:'Hồi 2 máu.'},
  compass:{deck:'white',type:'equip',name:'La Bàn Thần Bí',desc:'Khi di chuyển, tung 2 lần và chọn 1 kết quả.'},
  rosary:{deck:'white',type:'equip',name:'Chuỗi Bạc',desc:'Nếu đòn tấn công của bạn hạ gục ai, bạn lấy toàn bộ trang bị của người đó.'},
  spear:{deck:'white',type:'equip',name:'Giáo Longinus',desc:'Nếu bạn là Thợ Săn và đòn đánh trúng, có thể lộ diện; đã lộ diện thì đòn đánh gây thêm 2 sát thương.'},
  talisman:{deck:'white',type:'equip',name:'Bùa Hộ Mệnh',desc:'Bạn không chịu sát thương từ các thẻ Đen: Nhện Khát Máu, Dơi Hút Máu, Thuốc Nổ.'},
  banana:{deck:'black',type:'single',name:'Vỏ Chuối',desc:'Đưa 1 trang bị của bạn cho người khác. Không có trang bị thì chịu 1 sát thương.'},
  spider:{deck:'black',type:'single',name:'Nhện Khát Máu',desc:'Gây 2 sát thương cho 1 người bất kỳ và bạn tự chịu 2 sát thương.'},
  butcher:{deck:'black',type:'equip',name:'Dao Bầu',desc:'Đòn đánh trúng gây thêm 1 sát thương.'},
  chainsaw:{deck:'black',type:'equip',name:'Cưa Máy',desc:'Đòn đánh trúng gây thêm 1 sát thương.'},
  ritual:{deck:'black',type:'single',name:'Nghi Lễ Ác Ma',desc:'Nếu bạn là Bóng Tối, có thể lộ diện. Nếu lộ, hồi đầy máu.'},
  dynamite:{deck:'black',type:'single',name:'Thuốc Nổ',desc:'Tung 2 xúc xắc: mọi người ở khu có số đó (kể cả bạn) chịu 3 sát thương. Tung 7 thì không nổ.'},
  handgun:{deck:'black',type:'equip',name:'Súng Lục',desc:'Tầm đánh của bạn là mọi khu, trừ khu đang đứng.'},
  machinegun:{deck:'black',type:'equip',name:'Súng Máy',desc:'Đòn đánh nhắm mọi người trong tầm: tung 1 lần, áp cho tất cả.'},
  masamune:{deck:'black',type:'equip',name:'Kiếm Masamune',desc:'Bạn BẮT BUỘC tấn công nếu có mục tiêu. Đòn đánh chỉ tung d4 và không bao giờ trượt.'},
  goblin:{deck:'black',type:'single',name:'Yêu Tinh Nghịch',desc:'Cướp 1 trang bị (tự chọn) của 1 người.'},
  broadaxe:{deck:'black',type:'equip',name:'Rìu Gỉ',desc:'Đòn đánh trúng gây thêm 1 sát thương.'},
  doll:{deck:'black',type:'single',name:'Búp Bê Nguyền',desc:'Chọn 1 người và tung d6: 1–4 người đó chịu 3 sát thương, 5–6 bạn chịu 3.'},
  bat:{deck:'black',type:'single',name:'Dơi Hút Máu',desc:'Gây 2 sát thương cho 1 người bất kỳ, bạn hồi 1 máu.'},
};
const WHITE_DECK=['advent','blessing','chocolate','concealed','mirror','firstaid','flare','brooch','guardian','holyrobe','holywater','holywater','compass','rosary','spear','talisman'];
const BLACK_DECK=['banana','spider','butcher','chainsaw','ritual','dynamite','handgun','machinegun','masamune','goblin','goblin','broadaxe','doll','bat','bat','bat'];
// Thẻ Ẩn Sĩ (16)
const HERMIT={
  aid:{name:'Cầu Viện',cond:'hunter',eff:'healOrDmg'},
  anger:{name:'Phẫn Nộ',cond:'hs',eff:'giveOrDmg'},
  blackmail:{name:'Tống Tiền',cond:'hn',eff:'giveOrDmg'},
  bully:{name:'Bắt Nạt',cond:'hpLE11',eff:'dmg1'},
  exorcism:{name:'Trừ Tà',cond:'shadow',eff:'dmg2'},
  greed:{name:'Tham Lam',cond:'ns',eff:'giveOrDmg'},
  huddle:{name:'Xúm Lại',cond:'shadow',eff:'healOrDmg'},
  nurture:{name:'Chở Che',cond:'neutral',eff:'healOrDmg'},
  prediction:{name:'Tiên Tri',cond:'any',eff:'show'},
  slap:{name:'Tát',cond:'hunter',eff:'dmg1'},
  spell:{name:'Chú',cond:'shadow',eff:'dmg1'},
  lesson:{name:'Bài Học Đau',cond:'hpGE12',eff:'dmg2'},
};
const HERMIT_DECK=['aid','anger','anger','blackmail','blackmail','bully','exorcism','greed','greed','huddle','nurture','prediction','slap','slap','spell','lesson'];
const HCOND={hunter:'Thợ Săn',shadow:'Bóng Tối',neutral:'Trung Lập',hs:'Thợ Săn hoặc Bóng Tối',hn:'Thợ Săn hoặc Trung Lập',ns:'Trung Lập hoặc Bóng Tối',hpLE11:'nhân vật có máu tối đa từ 11 trở xuống',hpGE12:'nhân vật có máu tối đa từ 12 trở lên'};
const HEFF={dmg1:'chịu 1 sát thương',dmg2:'chịu 2 sát thương',healOrDmg:'hồi 1 máu (đang đầy máu thì chịu 1 sát thương)',giveOrDmg:'đưa 1 trang bị cho người đưa thẻ, hoặc chịu 1 sát thương'};
function hermitText(cid){const H=HERMIT[cid];if(H.eff==='show')return 'Bạn phải cho người đưa thẻ (và chỉ người đó) xem danh tính của mình.';return `Tôi cá bạn là ${HCOND[H.cond]}! Nếu đúng: ${HEFF[H.eff]}.`;}
function hermitMatch(cond,p){
  if(cond==='any')return true;
  if(cond==='hunter'||cond==='shadow'||cond==='neutral')return p.faction===cond;
  if(cond==='hs')return p.faction!=='neutral';
  if(cond==='hn')return p.faction!=='shadow';
  if(cond==='ns')return p.faction!=='hunter';
  if(cond==='hpLE11')return p.maxHp<=11;
  if(cond==='hpGE12')return p.maxHp>=12;
  return false;
}
const FACTION_LABEL={hunter:'Thợ Săn',shadow:'Bóng Tối',neutral:'Trung Lập'};
function factionLabel(f){return FACTION_LABEL[f]||f;}
function roleTitle(p){const c=CHARACTERS[p.char];return `${c?c.name:'?'} (${factionLabel(p.faction)})`;}
function eqName(id){return CARDS[id]?CARDS[id].name:id;}

// ================= TIỆN ÍCH / KẾT NỐI =================
const BROKER='wss://broker.emqx.io:8084/mqtt';
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);return v;}catch(e){return null;}};
const IS_BROWSER=(typeof document!=='undefined'&&!!document.getElementById);
let myId=LS('sbt_id');if(!myId){myId='p_'+Math.random().toString(36).slice(2,10);LS('sbt_id',myId);}
let myName='',room='',topic='',state=null,client=null,connected=false,joined=false,busy=false;
function $(id){return IS_BROWSER?document.getElementById(id):null;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function clone(o){return JSON.parse(JSON.stringify(o));}
function cur(){return state?clone(state):null;}
function d6(){return 1+Math.floor(Math.random()*6);}
function d4(){return 1+Math.floor(Math.random()*4);}
function esc(str){return String(str==null?'':str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function setStatus(){const el=$('status');if(!el)return;el.innerHTML=connected?`<span class="dot dot-on"></span>Đã kết nối${room?' · phòng <b>'+esc(room)+'</b>':''}`:'<span class="dot dot-off"></span>Mất kết nối — đang thử lại…';}
function setSyncError(v){const el=$('syncBanner');if(el)el.style.display=v?'block':'none';setStatus();}
function connectMQTT(){
  if(typeof mqtt==='undefined'||(typeof window!=='undefined'&&window.__mqttFail)){setSyncError(true);const el=$('status');if(el)el.innerHTML='<span class="dot dot-off"></span>Không tải được thư viện mạng — host file ở nơi khác.';return;}
  client=mqtt.connect(BROKER,{clientId:'sbt_'+Math.random().toString(16).slice(2,10),clean:true,connectTimeout:8000,reconnectPeriod:3000,keepalive:30});
  client.on('connect',()=>{connected=true;setSyncError(false);if(topic)client.subscribe(topic,{qos:0});});
  client.on('message',(t,p)=>{if(t!==topic)return;let s;try{s=JSON.parse(p.toString());}catch(e){return;}if(!s||typeof s!=='object'||!s.phase)return;state=s;onState();});
  client.on('reconnect',()=>{connected=false;setStatus();});
  client.on('offline',()=>{connected=false;setSyncError(true);});
  client.on('error',()=>{connected=false;setSyncError(true);});
  client.on('close',()=>{connected=false;setStatus();});
}
function setRoom(code){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);if(code.length<3)return false;
  if(topic&&client&&connected&&topic!=='sanbongtoi/v2/'+code+'/state')client.unsubscribe(topic);
  room=code;topic='sanbongtoi/v2/'+code+'/state';state=null;LS('sbt_room',code);
  if(client&&connected)client.subscribe(topic,{qos:0});
  try{history.replaceState(null,'','#'+code);}catch(e){}
  return true;
}
function publishState(s){state=s;if(client&&connected&&topic){client.publish(topic,JSON.stringify(s),{qos:0,retain:true});setSyncError(false);}else if(IS_BROWSER)setSyncError(true);}
function waitConnected(ms){return new Promise(res=>{if(connected)return res(true);const t0=Date.now();const iv=setInterval(()=>{if(connected||Date.now()-t0>ms){clearInterval(iv);res(connected);}},150);});}
function waitState(ms){return new Promise(res=>{const t0=Date.now();const iv=setInterval(()=>{if(state||Date.now()-t0>ms){clearInterval(iv);res(!!state);}},100);});}

function addLog(s,t){s.seq=(s.seq||0)+1;s.log.push({n:s.seq,t});if(s.log.length>80)s.log=s.log.slice(-80);}
function freshLobby(){const s={v:2,phase:'lobby',seq:0,host:null,players:{},order:[],waiting:[],log:[]};addLog(s,'Sảnh chờ mở. Cần 4–8 người (bot tính là người).');return s;}
function commit(s){normalize(s);s.seq=(s.seq||0)+1;publishState(s);render();}
function act(fn){if(busy)return;const s=cur();if(!s)return;busy=true;let ok=false;try{ok=fn(s);}catch(e){console.error(e);}busy=false;if(ok)commit(s);else render();}
function onState(){if(!joined){render();return;}fixups();render();}

// ================= SẢNH =================
function addMe(s){
  if(s.phase==='lobby'){
    if(s.players[myId]){s.players[myId].name=myName;}
    else if(Object.keys(s.players).length>=8){if(!s.waiting.some(w=>w.id===myId))s.waiting.push({id:myId,name:myName});}
    else{s.players[myId]={name:myName,isBot:false};s.waiting=s.waiting.filter(w=>w.id!==myId);addLog(s,`${myName} vào sảnh.`);}
  }else{
    if(!s.players[myId]&&!s.waiting.some(w=>w.id===myId))s.waiting.push({id:myId,name:myName});
  }
  if(!s.host||!s.players[s.host]||s.players[s.host].isBot)s.host=firstHuman(s)||myId;
}
function firstHuman(s){const ids=s.order&&s.order.length?s.order:Object.keys(s.players);return ids.find(id=>s.players[id]&&!s.players[id].isBot)||null;}
function controllerId(s){if(s.host&&s.players[s.host]&&!s.players[s.host].isBot)return s.host;return firstHuman(s);}
function isHost(s){return s&&s.host===myId;}
async function joinRoom(){
  const ni=$('nameInput'),ri=$('roomInput');const name=(ni?ni.value:'').trim();const code=(ri?ri.value:'').trim();
  if(!name){if(ni)ni.focus();return;}
  if(!setRoom(code)){if(ri){ri.focus();ri.placeholder='Mã phòng cần 3–8 chữ/số';}return;}
  myName=name;LS('sbt_name',name);joined=true;
  const btn=$('joinBtn');if(btn){btn.disabled=true;btn.textContent='Đang vào…';}
  render();
  const ok=await waitConnected(7000);
  if(!ok){setSyncError(true);joined=false;if(btn){btn.disabled=false;btn.textContent='Thử lại';}render();return;}
  await waitState(4000);
  const s=cur()||freshLobby();addMe(s);commit(s);
  if(btn){btn.disabled=false;btn.textContent='Vào phòng';}
}
function fixups(){
  const s=state;if(!s)return;
  if(s.phase==='lobby'){
    if(!s.players[myId]&&!(s.waiting||[]).some(w=>w.id===myId)){const ss=cur();addMe(ss);commit(ss);return;}
  }
}
function leaveRoom(){
  act(s=>{if(s.phase==='lobby'&&s.players[myId]){delete s.players[myId];addLog(s,`${myName} rời sảnh.`);}s.waiting=(s.waiting||[]).filter(w=>w.id!==myId);if(s.host===myId)s.host=firstHuman(s);return true;});
  joined=false;myName='';render();
}
function resetRoom(){if(!connected){setSyncError(true);return;}if(!confirm('Đặt lại phòng về sảnh trống? Ván đang chơi (nếu có) sẽ mất.'))return;const s=freshLobby();addMe(s);commit(s);}
function claimHost(){act(s=>{if(!confirm('Nhận quyền chủ phòng?'))return false;s.host=myId;addLog(s,`👑 ${myName} làm chủ phòng.`);return true;});}
function kickLobby(id){act(s=>{if(s.phase!=='lobby'||s.host!==myId||!s.players[id])return false;const n=s.players[id].name;delete s.players[id];addLog(s,`${n} bị xóa khỏi sảnh.`);return true;});}
function addBot(){act(s=>{if(s.phase!=='lobby'||Object.keys(s.players).length>=8)return false;const n=Object.values(s.players).filter(p=>p.isBot).length+1;s.players['bot_'+Math.random().toString(36).slice(2,8)]={name:'Bot '+n,isBot:true};return true;});}
function removeBot(){act(s=>{if(s.phase!=='lobby')return false;const b=Object.keys(s.players).filter(id=>s.players[id].isBot);if(!b.length)return false;delete s.players[b[b.length-1]];return true;});}
function newLobbyFrom(s){const lobby=freshLobby();lobby.seq=s.seq||0;lobby.host=s.host;(s.order||[]).forEach(id=>{lobby.players[id]={name:s.players[id].name,isBot:!!s.players[id].isBot};});(s.waiting||[]).forEach(w=>{if(!lobby.players[w.id]&&Object.keys(lobby.players).length<8)lobby.players[w.id]={name:w.name,isBot:false};});if(!lobby.host||!lobby.players[lobby.host])lobby.host=firstHuman(lobby);addLog(lobby,'Ván mới — bấm Bắt đầu khi đủ người.');return lobby;}

// ================= BẮT ĐẦU VÁN =================
function startGame(s){
  const ids=Object.keys(s.players);const n=ids.length;if(n<4||n>8)return false;
  const [nh,ns,nn]=ALLOC[n];
  const chars=shuffle([...shuffle(HUNTER_POOL).slice(0,nh),...shuffle(SHADOW_POOL).slice(0,ns),...shuffle(NEUTRAL_POOL).slice(0,nn)]);
  const order=shuffle(ids);const players={};
  order.forEach((id,i)=>{const ch=chars[i],c=CHARACTERS[ch];players[id]={name:s.players[id].name,isBot:!!s.players[id].isBot,char:ch,faction:c.faction,maxHp:c.hp,hp:c.hp,alive:true,left:false,area:null,revealed:false,equip:[],usedPower:false,kills:0,won:null};});
  s.players=players;s.order=order;s.turnIdx=0;s.round=1;s.phase='playing';
  const sh=shuffle(AREA_IDS);s.zones=[[sh[0],sh[1]],[sh[2],sh[3]],[sh[4],sh[5]]];
  s.decks={white:shuffle(WHITE_DECK),black:shuffle(BLACK_DECK),hermit:shuffle(HERMIT_DECK)};s.discards={white:[],black:[],hermit:[]};
  s.deathOrder=[];s.guarded={};s.lootQ=[];s.wins={};s.hermitLast=null;s.extraTurns=0;s.winner=null;s.log=[];
  resetTurn(s);
  addLog(s,`🌘 Ván bắt đầu với ${n} người: ${nh} Thợ Săn, ${ns} Bóng Tối, ${nn} Trung Lập. Lượt đầu: ${players[order[0]].name}.`);
  return true;
}

// ================= TRUY VẤN TRẠNG THÁI =================
function TID(s){return s.order[s.turnIdx];}
function P(s,id){return s.players[id];}
function aliveIds(s){return s.order.filter(id=>s.players[id].alive);}
function othersAlive(s,id){return aliveIds(s).filter(x=>x!==id);}
function hasEq(p,cid){return !!(p&&p.equip&&p.equip.includes(cid));}
function pendingActor(s){return s.pending?(s.pending.actor||TID(s)):TID(s);}
function canAct(s,pid){if(!s||s.phase!=='playing')return false;const p=s.players[pid];if(!p||!p.alive)return false;return pendingActor(s)===pid;}
function turnStep(s,pid,step){return s&&s.phase==='playing'&&TID(s)===pid&&s.players[pid].alive&&s.step===step&&!s.pending&&!s.atk;}
function pend(s,pid,kind){return s&&s.phase==='playing'&&s.pending&&s.pending.kind===kind&&pendingActor(s)===pid&&s.players[pid]&&s.players[pid].alive;}
function zoneOf(s,areaId){for(const z of s.zones){if(z.includes(areaId))return z;}return [areaId];}
function attackTargets(s,pid){const p=s.players[pid];if(!p.area)return [];const areas=hasEq(p,'handgun')?AREA_IDS.filter(a=>a!==p.area):zoneOf(s,p.area);return aliveIds(s).filter(id=>id!==pid&&areas.includes(s.players[id].area));}
function atkBonus(p){let b=0;p.equip.forEach(e=>{if(e==='butcher'||e==='chainsaw'||e==='broadaxe')b+=1;if(e==='holyrobe')b-=1;});return b;}
function emiOptions(s,pid){const p=s.players[pid];if(!p.area)return [];const zi=s.zones.findIndex(z=>z.includes(p.area));const z=s.zones[zi];const side=z.indexOf(p.area);const out=[z[1-side]];if(s.zones[zi-1])out.push(s.zones[zi-1][1-side]);if(s.zones[zi+1])out.push(s.zones[zi+1][1-side]);return out;}
function discardCard(s,cid){const C=CARDS[cid];if(C)s.discards[C.deck].push(cid);}
function discardAll(s,p){(p.equip||[]).forEach(c=>discardCard(s,c));p.equip=[];}
function draw(s,deck){const D=s.decks[deck];if(!D.length){const disc=s.discards[deck];if(!disc.length)return null;s.decks[deck]=shuffle(disc);s.discards[deck]=[];addLog(s,`🔄 Bộ ${deck==='white'?'Trắng':deck==='black'?'Đen':'Ẩn Sĩ'} hết, xào lại chồng bỏ.`);}return s.decks[deck].shift();}

// ================= SÁT THƯƠNG / CHẾT / LƯỢM ĐỒ =================
function heal(s,id,amt){const p=s.players[id];if(!p.alive||amt<=0)return 0;const before=p.hp;p.hp=Math.min(p.maxHp,p.hp+amt);return p.hp-before;}
function damage(s,id,amt,srcId,isAttack){
  const p=s.players[id];if(!p||!p.alive||amt<=0||s.phase!=='playing')return 0;
  if(isAttack){
    if(s.guarded&&s.guarded[id]){addLog(s,`🛡️ ${p.name} được Thiên Thần Hộ Mệnh che chở, không mất máu.`);return 0;}
    if(hasEq(p,'holyrobe'))amt-=1;
    if(amt<=0)return 0;
  }
  p.hp=Math.max(0,p.hp-amt);
  if(p.hp<=0)die(s,id,srcId,isAttack);
  return amt;
}
function die(s,id,killerId,byAttack){
  const p=s.players[id];if(!p.alive)return;
  p.alive=false;p.revealed=true;s.deathOrder.push(id);if(s.guarded)delete s.guarded[id];
  addLog(s,`💀 ${p.name} gục ngã! Danh tính: ${roleTitle(p)}.`);
  s.order.forEach(x=>{const q=s.players[x];if(x!==id&&q.alive&&q.char==='daniel'&&!q.revealed){q.revealed=true;addLog(s,`👁️ ${q.name} hét lên và lộ diện: Daniel (Trung Lập).`);}});
  if(killerId&&killerId!==id&&s.players[killerId]){
    const k=s.players[killerId];k.kills=(k.kills||0)+1;
    if(byAttack&&k.char==='charles'&&s.deathOrder.length>=3){s.wins=s.wins||{};s.wins[killerId]=true;}
    if(p.equip.length)s.lootQ.push({killer:killerId,victim:id,byAttack:!!byAttack});
  }else if(p.equip.length)discardAll(s,p);
  checkWin(s);
}
function processLoots(s){
  while(s.lootQ&&s.lootQ.length){
    const L=s.lootQ[0];const k=s.players[L.killer],v=s.players[L.victim];
    if(!k||!k.alive||!v.equip.length){discardAll(s,v);s.lootQ.shift();continue;}
    if(L.byAttack&&hasEq(k,'rosary')){k.equip.push(...v.equip);addLog(s,`📿 ${k.name} (Chuỗi Bạc) lấy toàn bộ trang bị của ${v.name}: ${v.equip.map(eqName).join(', ')}.`);v.equip=[];s.lootQ.shift();continue;}
    if(v.equip.length===1){const g=v.equip.pop();k.equip.push(g);addLog(s,`🎒 ${k.name} lấy "${eqName(g)}" của ${v.name}.`);s.lootQ.shift();continue;}
    s.pending={kind:'loot',actor:L.killer,victim:L.victim};return true;
  }
  return false;
}
function checkWin(s){
  if(s.phase!=='playing')return false;
  const ids=s.order.filter(id=>!s.players[id].left);const g=id=>s.players[id];
  const alive=ids.filter(id=>g(id).alive);
  const hunters=ids.filter(id=>g(id).faction==='hunter'),shadows=ids.filter(id=>g(id).faction==='shadow');
  const neutralsDead=ids.filter(id=>g(id).faction==='neutral'&&!g(id).alive).length;
  const huntersWin=shadows.length===0?hunters.length>0:shadows.every(id=>!g(id).alive);
  const shadowsWin=(hunters.length===0?shadows.length>0:hunters.every(id=>!g(id).alive))||neutralsDead>=3;
  const factionsGone=hunters.length===0&&shadows.length===0;
  const deaths=s.deathOrder||[];
  const nw=id=>{const p=g(id);switch(p.char){case 'bob':return p.alive&&p.equip.length>=5;case 'charles':return !!(s.wins&&s.wins[id]);case 'daniel':return deaths[0]===id||(p.alive&&huntersWin);default:return false;}};
  const instant=ids.filter(id=>g(id).faction==='neutral'&&nw(id));
  if(!(huntersWin||shadowsWin||instant.length||alive.length===0||factionsGone))return false;
  ids.forEach(id=>{const p=g(id);p.won=p.faction==='hunter'?huntersWin:p.faction==='shadow'?shadowsWin:(p.char==='allie'?p.alive:nw(id));});
  s.phase='ended';s.pending=null;s.atk=null;s.lootQ=[];
  s.winner=huntersWin?'hunter':shadowsWin?'shadow':instant.length?'neutral':'draw';
  const winners=ids.filter(id=>g(id).won).map(id=>g(id).name);
  addLog(s,`🏁 Ván kết thúc! ${winners.length?'Thắng: '+winners.join(', ')+'.':'Không ai thắng.'}`);
  return true;
}

// ================= LƯỢT =================
function resetTurn(s){s.step='move';s.areaDone=false;s.attacked=false;s.lastTargets=null;s.pending=null;s.atk=null;s.lastRoll=null;}
function advanceTurn(s){
  if(s.phase!=='playing')return;
  const n=s.order.length;let i=s.turnIdx,g=0;
  do{i=(i+1)%n;if(i===0)s.round++;g++;}while(g<=n&&!s.players[s.order[i]].alive);
  if(!s.players[s.order[i]].alive){checkWin(s);return;}
  s.turnIdx=i;s.extraTurns=0;resetTurn(s);
  if(s.guarded)delete s.guarded[s.order[i]];
  addLog(s,`➡️ Vòng ${s.round} — lượt của ${s.players[s.order[i]].name}.`);
}
function areaDone(s){s.areaDone=true;if(s.step==='area')s.step='attack';}
// Gọi sau mỗi hành động: xử lý lượm đồ, đòn đang dang dở, người tới lượt đã chết
function afterAction(s){
  for(let guard=0;guard<10;guard++){
    checkWin(s);
    if(s.phase!=='playing'||s.pending)return;
    if(s.atk){resumeAttack(s);if(s.pending||s.atk)return;continue;}
    if(processLoots(s))return;
    const tp=s.players[TID(s)];
    if(!tp||!tp.alive){advanceTurn(s);return;}
    return;
  }
}
function normalize(s){
  if(s.phase==='playing'){
    if(s.pending){const a=s.players[pendingActor(s)];if(!a||!a.alive){forceDefault(s);}}
    afterAction(s);
    checkWin(s);
  }
  if(!s.host||!s.players[s.host]||s.players[s.host].isBot)s.host=firstHuman(s);
}

// ================= HÀNH ĐỘNG (dùng chung cho người và bot) =================
const H={};
// --- lộ diện / năng lực ---
H.reveal=function(s,pid){const me=P(s,pid);if(!me||!me.alive||me.revealed||me.char==='daniel'||s.phase!=='playing')return false;me.revealed=true;addLog(s,`👁️ ${me.name} lộ diện: ${roleTitle(me)}.`);return true;};
H.usePower=function(s,pid){
  const me=P(s,pid);if(!me||!me.alive||!me.revealed||me.usedPower||s.phase!=='playing')return false;
  if(me.char==='allie'){me.hp=me.maxHp;me.usedPower=true;addLog(s,`✨ ${me.name} (Allie) hồi đầy máu.`);return true;}
  if(me.char==='franklin'||me.char==='george'){
    if(!turnStep(s,pid,'move'))return false;
    const tg=othersAlive(s,pid);if(!tg.length)return false;
    s.pending={kind:'powerTarget',actor:pid,targets:tg};return true;
  }
  return false;
};
H.powerTarget=function(s,pid,t){
  if(!pend(s,pid,'powerTarget')||!s.pending.targets.includes(t))return false;
  const me=P(s,pid);const r=me.char==='franklin'?d6():d4();me.usedPower=true;s.pending=null;
  s.lastRoll={name:me.name,a:r,b:null,sum:r,kind:'power'};
  addLog(s,`⚡ ${me.name} (${CHARACTERS[me.char].name}) tung ${me.char==='franklin'?'d6':'d4'} = ${r}: ${P(s,t).name} chịu ${r} sát thương.`);
  damage(s,t,r,pid,false);afterAction(s);return true;
};
H.wightUse=function(s,pid){
  const me=P(s,pid);if(!turnStep(s,pid,'attack')||!s.attacked||me.char!=='wight'||!me.revealed||me.usedPower)return false;
  const n=s.deathOrder.length;if(!n)return false;
  me.usedPower=true;s.extraTurns=(s.extraTurns||0)+n;addLog(s,`🧟 ${me.name} (Wight) dùng Nhân Bản: được thêm ${n} lượt.`);return true;
};
// --- di chuyển ---
function rollMoveOnce(){const a=d6(),b=d4();return {a,b,sum:a+b};}
H.rollMove=function(s,pid){
  if(!turnStep(s,pid,'move'))return false;const me=P(s,pid);
  if(hasEq(me,'compass')){const r1=rollMoveOnce(),r2=rollMoveOnce();s.pending={kind:'chooseRoll',actor:pid,rolls:[r1,r2]};addLog(s,`🧭 ${me.name} dùng La Bàn, tung 2 lần: ${r1.a}+${r1.b}=${r1.sum} và ${r2.a}+${r2.b}=${r2.sum}.`);return true;}
  applyRoll(s,pid,rollMoveOnce());return true;
};
H.chooseRoll=function(s,pid,i){if(!pend(s,pid,'chooseRoll'))return false;const r=s.pending.rolls[i];if(!r)return false;s.pending=null;applyRoll(s,pid,r);return true;};
function applyRoll(s,pid,r){
  const me=P(s,pid);let txt=`🎲 ${me.name} tung ${r.a}+${r.b}=${r.sum}`;s.lastRoll={name:me.name,a:r.a,b:r.b,sum:r.sum,kind:'move'};
  let area=r.sum===7?null:numToArea(r.sum);let guard=0;

H.endTurn=function(s,pid){

// --- xử lý mặc định / chủ phòng ---
function forceDefault(s){
  const p=s.pending;if(!p)return false;const a=pendingActor(s);const ap=P(s,a);
  if(ap&&ap.alive){
    switch(p.kind){
      case 'spear':return H.spearDecide(s,a,false);
      case 'bob':return H.bobDecide(s,a,'dmg');
      case 'counter':return H.counterDecide(s,a,false);
      case 'loot':return H.lootPick(s,a,0);
      case 'hermitChoice':return H.hermitChoice(s,a,'dmg');
      default:return forceSkip(s);

  }
  // người phải quyết định đã chết/rời ván: gỡ quyết định, không gây hiệu ứng phụ
  switch(p.kind){
    case 'loot':{s.pending=null;discardAll(s,P(s,p.victim));if(s.lootQ&&s.lootQ.length)s.lootQ.shift();break;}
    case 'counter':{s.pending=null;queueCounter(s,p.rest||[],p.attacker);break;}
    case 'hermitChoice':{s.pending=null;s.hermitLast=Object.assign({},s.hermitLast||{},{n:s.seq,result:'Người nhận không còn trong ván.',waiting:false});break;}
    case 'spear':case 'bob':{s.pending=null;s.atk=null;break;}
    default:return forceSkip(s);

}
function forceSkip(s){
  if(s.phase!=='playing')return false;

  s.pending=null;s.atk=null;
  while(s.lootQ&&s.lootQ.length){const L=s.lootQ.shift();const k=P(s,L.killer),v=P(s,L.victim);if(k&&k.alive&&v.equip.length){k.equip.push(v.equip[0]);}discardAll(s,v);}
  addLog(s,`⏭️ Bỏ lượt của ${name}.`);advanceTurn(s);return true;
}
H.hostSkip=function(s,pid){if(s.host!==pid||s.phase!=='playing')return false;return forceSkip(s);};
H.hostKick=function(s,pid,t){

  const refs=q=>!!q&&(q.target===t||q.victim===t||q.attacker===t||q.from===t||(q.targets&&q.targets.includes(t))||(q.rest&&q.rest.includes(t)));
  if(s.pending&&pendingActor(s)===t&&['counter','hermitChoice','loot'].includes(s.pending.kind))forceDefault(s);
  if(s.phase==='playing'&&(TID(s)===t||refs(s.pending)||(s.atk&&(s.atk.att===t||s.atk.targets.includes(t)))))forceSkip(s);else afterAction(s);
  return true;
};
H.newGame=function(s,pid){if(s.phase!=='ended')return false;const l=newLobbyFrom(s);Object.assign(s,l);Object.keys(s).forEach(k=>{if(!(k in l))delete s[k];});return true;};
H.startGame=function(s,pid){if(s.phase!=='lobby'||!s.players[pid])return false;return startGame(s);};

// ================= BOT (để test) =================
function botAct(s,id){
  const me=P(s,id);if(!me||!me.alive||s.phase!=='playing')return false;
  const p=s.pending;
  if(p){
    if(pendingActor(s)!==id)return false;
    const o=othersAlive(s,id);
    switch(p.kind){
      case 'chooseRoll':{const i=p.rolls.findIndex(r=>r.sum!==7&&numToArea(r.sum)!==me.area);return H.chooseRoll(s,id,i>=0?i:0);}
      case 'chooseArea':return H.chooseArea(s,id,pick(AREA_IDS.filter(a=>a!==me.area)));
      case 'gateDeck':return H.gatePick(s,id,pick(['white','black','hermit']));
      case 'hermitGive':return o.length?H.hermitGive(s,id,pick(o)):forceSkip(s);
      case 'hermitChoice':return (me.equip.length&&Math.random()<0.5)?H.hermitChoice(s,id,0):H.hermitChoice(s,id,'dmg');
      case 'cardTarget':{const tg=p.targets.filter(x=>x!==id);return H.cardTarget(s,id,p.card==='firstaid'?pick(p.targets):(tg.length?pick(tg):p.targets[0]));}
      case 'bananaItem':return H.bananaItem(s,id,0);
      case 'bananaTarget':return H.bananaTarget(s,id,pick(p.targets));
      case 'stealTarget':return H.stealTarget(s,id,pick(p.targets));
      case 'stealItem':return H.stealItem(s,id,0);
      case 'optReveal':return H.optReveal(s,id,true);
      case 'woods':{const tg=p.targets.filter(x=>x!==id);return (tg.length&&Math.random()<0.6)?H.woodsDo(s,id,pick(tg),'dmg'):H.woodsDo(s,id,id,'heal');}
      case 'powerTarget':return H.powerTarget(s,id,pick(p.targets));
      case 'spear':return H.spearDecide(s,id,true);
      case 'bob':return H.bobDecide(s,id,Math.random()<0.5?0:'dmg');
      case 'counter':return H.counterDecide(s,id,Math.random()<0.8);
      case 'loot':return H.lootPick(s,id,0);
      default:return false;
    }
  }
  if(TID(s)!==id)return false;
  switch(s.step){
    case 'move':
      if(!me.revealed&&me.char!=='daniel'&&Math.random()<0.2)return H.reveal(s,id);
      if(me.revealed&&!me.usedPower){
        if(me.char==='allie'&&me.hp<=me.maxHp/2)return H.usePower(s,id);
        if((me.char==='franklin'||me.char==='george')&&Math.random()<0.6&&othersAlive(s,id).length)return H.usePower(s,id);
      }
      if(me.char==='emi'&&me.revealed&&me.area&&Math.random()<0.3){const op=emiOptions(s,id);if(op.length)return H.emiMove(s,id,pick(op));}
      return H.rollMove(s,id);
    case 'area':return Math.random()<0.85?H.doArea(s,id):H.skipArea(s,id);
    case 'attack':
      if(!s.attacked){const tg=attackTargets(s,id);if(tg.length&&(hasEq(me,'masamune')||Math.random()<0.6))return H.attackTarget(s,id,pick(tg));return H.noAttack(s,id);}
      if(me.char==='charles'&&me.revealed&&s.lastTargets&&me.hp>4&&Math.random()<0.3&&s.lastTargets.some(x=>P(s,x).alive))return H.charlesAgain(s,id);
      if(me.char==='wight'&&me.revealed&&!me.usedPower&&s.deathOrder.length)return H.wightUse(s,id);
      return H.endTurn(s,id);
  }
  return false;
}
let botKey=null,wdKey=null,deadKey=null;
function scheduleBots(){
  const s=state;if(!s||s.phase!=='playing')return;

  if(botKey===s.seq)return;botKey=s.seq;
  setTimeout(()=>{const st=state;if(!st||st.phase!=='playing'||st.seq!==botKey||pendingActor(st)!==id)return;const ss=cur();let ok=false;try{ok=botAct(ss,id);}catch(e){console.error('bot',e);}if(!ok){addLog(ss,`🤖 ${ss.players[id].name} không hành động được, bỏ lượt.`);forceSkip(ss);}commit(ss);},900);
}
// Người khác không phản hồi quá lâu → xử lý mặc định (chỉ với quyết định ngoài lượt)
function watchdog(){

  const actor=pendingActor(s);const ap=s.players[actor];if(!ap||ap.isBot||actor===myId||actor===TID(s))return;
  const tid=TID(s),tp=s.players[tid];

  if(!iRun||wdKey===s.seq)return;wdKey=s.seq;
  setTimeout(()=>{const st=state;if(!st||st.phase!=='playing'||st.seq!==wdKey||!st.pending)return;const ss=cur();addLog(ss,`⏱️ ${ss.players[pendingActor(ss)].name} không phản hồi, xử lý mặc định.`);forceDefault(ss);commit(ss);},45000);
}
// Người tới lượt đã chết/rời mà không ai xử lý → chủ phòng tự chuyển lượt
function deadTurnFix(){
  const s=state;if(!s||s.phase!=='playing'||s.pending||s.atk)return;const tp=s.players[TID(s)];if(!tp||tp.alive)return;

let lastSeenSeq=null,lastHermitN=0;
function pushToast(html,cls){const stack=$('toastStack');if(!stack)return;const el=document.createElement('div');el.className='toast'+(cls?' '+cls:'');el.innerHTML=html;const rm=()=>{if(el.parentNode){el.style.transition='opacity .25s';el.style.opacity='0';setTimeout(()=>el.remove(),250);}};el.onclick=rm;stack.appendChild(el);while(stack.children.length>4)stack.firstChild.remove();setTimeout(rm,cls==='green'?20000:9000);}
function processEvents(s){

  else if(canAct(s,myId))controls=renderControls(s,me);
  else controls=`<div class="card center muted">⏳ Đang chờ <b>${esc(s.players[pendingActor(s)].name)}</b>: ${waitLabel(s)}</div>`;
  const zones=s.zones.map((z,zi)=>`<div class="card" style="padding:10px;"><div class="zone-tag">Cặp ${zi+1} — cùng tầm đánh</div>${z.map(aid=>{const here=aliveIds(s).filter(id=>s.players[id].area===aid);return `<div class="area-card ${me.area===aid?'here':''}"><div class="between"><b class="small">${AREAS[aid].name}</b><span class="muted small">${AREAS[aid].nums.join('/')}</span></div>${here.length?here.map(id=>{const p=s.players[id];return `<div class="small" style="margin-top:3px;">${esc(p.name)}${id===myId?' (bạn)':''}${tid===id?' 🎯':''} ${dmgBadge(p)}<div>${chips(p)}</div></div>`;}).join(''):'<div class="muted small">(trống)</div>'}</div>`;}).join('')}</div>`).join('');
  const roster=s.order.map(id=>{const p=s.players[id];const mine=id===myId;return `<div class="pill ${p.alive?'':'dead'}"><div><div>${p.alive?'':'💀 '}${esc(p.name)}${mine?' <span class="tag tag-you">Bạn</span>':''}${tid===id&&p.alive?' 🎯':''}${s.host===id?' 👑':''} ${p.revealed||mine?`<span class="tag tag-${p.faction}">${roleTitle(p)}</span>`:'<span class="muted small">(ẩn danh)</span>'}</div><div style="margin-top:3px;">${chips(p)}</div></div><div style="text-align:right;white-space:nowrap;">${mine?`<b class="small">${p.hp}/${p.maxHp}</b>`:dmgBadge(p)}</div></div>`;}).join('');
  let hostTools='';
  if(isHost(s))hostTools=`<div class="card"><div class="muted small" style="margin-bottom:4px;">👑 Công cụ chủ phòng (khi có người mất kết nối):</div><div class="row"><button class="btn-ghost btn-sm" onclick="confirmSkip()">⏭️ Bỏ lượt của ${esc(s.players[tid].name)}</button>${s.order.filter(id=>id!==myId&&s.players[id].alive).map(id=>`<button class="btn-ghost btn-sm" onclick="confirmKick('${id}')">🚪 Loại ${esc(s.players[id].name)}</button>`).join('')}<button class="btn-ghost btn-sm" onclick="resetRoom()">Đặt lại phòng</button></div></div>`;
  else hostTools=`<div class="center"><button class="btn-ghost btn-sm" onclick="claimHost()">👑 Chủ phòng mất kết nối? Tôi làm chủ phòng</button></div>`;
  app.innerHTML=`${topBar()}${myCard}${hermitPanel}${controls}${rollCard}${zones}<div class="card"><div class="muted" style="margin-bottom:5px;">Người chơi</div>${roster}</div><div class="card"><div class="muted" style="margin-bottom:5px;">Nhật ký</div><div class="log">${logHtml(s)}</div></div>${hostTools}`;
}
function renderControls(s,me){
  const p=s.pending;const btn=(cls,fn,label,dis)=>`<button class="${cls}" onclick="${fn}" ${dis?'disabled':''}>${label}</button>`;const pl=id=>esc(s.players[id].name);
  if(p){
    switch(p.kind){
      case 'chooseRoll':return boxCard('🧭 La Bàn — chọn 1 kết quả:',p.rolls.map((r,i)=>btn('btn-gold',`UI.chooseRoll(${i})`,`${r.a}+${r.b}=${r.sum} → ${r.sum===7?'chọn khu bất kỳ':AREAS[numToArea(r.sum)].name}${r.sum!==7&&numToArea(r.sum)===me.area?' (trùng, sẽ tung lại)':''}`)).join(''));
      case 'chooseArea':return boxCard('Tung được 7 — chọn khu để tới:',AREA_IDS.filter(a=>a!==me.area).map(a=>btn('btn-ghost',`UI.chooseArea('${a}')`,AREAS[a].name)).join(''));
      case 'gateDeck':return boxCard('🔮 Cổng Địa Ngục — chọn bộ bài:',btn('btn-ghost',"UI.gatePick('white')",'⬜ Trắng')+btn('btn-ghost',"UI.gatePick('black')",'⬛ Đen')+btn('btn-heal',"UI.gatePick('hermit')",'🟢 Ẩn Sĩ'));
      case 'hermitGive':return `<div class="card private"><b>🟢 Thẻ Ẩn Sĩ "${esc(HERMIT[p.card].name)}"</b><div class="cardbox">${esc(hermitText(p.card))}</div><div class="muted small" style="margin-bottom:4px;">Chỉ bạn và người nhận biết nội dung. Đưa cho:</div><div class="row">${othersAlive(s,myId).map(id=>btn('btn-target',`UI.hermitGive('${id}')`,pl(id))).join('')}</div></div>`;
      case 'hermitChoice':return `<div class="card private"><b>🟢 ${pl(p.from)} đưa bạn thẻ Ẩn Sĩ "${esc(HERMIT[p.card].name)}"</b><div class="cardbox">${esc(hermitText(p.card))}</div><div class="small" style="margin-bottom:4px;">Bạn trúng điều kiện. Chọn:</div><div class="row">${me.equip.map((c,i)=>btn('btn-ghost',`UI.hermitChoice(${i})`,`Đưa "${esc(eqName(c))}"`)).join('')}${btn('btn-target',"UI.hermitChoice('dmg')",'Chịu 1 sát thương')}</div></div>`;
      case 'cardTarget':{const lbl={blessing:'⬜ Ban Phước — chọn người để hồi máu (tung d6):',firstaid:'⬜ Sơ Cứu — đặt sát thương của ai về 7:',spider:'⬛ Nhện Khát Máu — gây 2 sát thương cho ai (bạn tự chịu 2):',doll:'⬛ Búp Bê Nguyền — chọn mục tiêu (tung d6: 1–4 họ −3, 5–6 bạn −3):',bat:'⬛ Dơi Hút Máu — gây 2 sát thương cho ai (bạn hồi 1):'}[p.card]||'Chọn mục tiêu:';return boxCard(lbl,p.targets.map(id=>btn(id===myId?'btn-ghost':'btn-target',`UI.cardTarget('${id}')`,pl(id)+(id===myId?' (bạn)':''))).join(''));}
      case 'bananaItem':return boxCard('⬛ Vỏ Chuối — chọn trang bị để đưa đi:',me.equip.map((c,i)=>btn('btn-ghost',`UI.bananaItem(${i})`,esc(eqName(c)))).join(''));
      case 'bananaTarget':return boxCard(`⬛ Vỏ Chuối — đưa "${esc(eqName(p.item))}" cho:`,p.targets.map(id=>btn('btn-target',`UI.bananaTarget('${id}')`,pl(id))).join(''));
      case 'stealTarget':return boxCard(`${p.src==='altar'?'🏛️ Bàn Thờ Cổ':'⬛ Yêu Tinh Nghịch'} — cướp trang bị của:`,p.targets.map(id=>btn('btn-target',`UI.stealTarget('${id}')`,pl(id)+' ('+s.players[id].equip.length+' món)')).join(''));
      case 'stealItem':return boxCard(`Chọn trang bị của ${pl(p.target)} để cướp:`,s.players[p.target].equip.map((c,i)=>btn('btn-ghost',`UI.stealItem(${i})`,esc(eqName(c)))).join(''));
      case 'optReveal':return boxCard(`${esc(CARDS[p.card].name)}: lộ diện để hồi đầy máu?`,btn('btn-heal','UI.optReveal(true)','👁️ Lộ diện và hồi đầy máu')+btn('btn-ghost','UI.optReveal(false)','Không lộ'));
      case 'woods':return `<div class="card"><div class="muted small" style="margin-bottom:4px;">🌲 Rừng Quái Dị — gây 2 sát thương cho:</div><div class="row">${p.targets.filter(id=>id!==myId).map(id=>btn('btn-target',`UI.woodsDo('${id}','dmg')`,pl(id))).join('')}</div><div class="muted small" style="margin:6px 0 4px;">Hoặc hồi 1 máu cho:</div><div class="row">${p.targets.map(id=>btn('btn-heal',`UI.woodsDo('${id}','heal')`,pl(id)+(id===myId?' (bạn)':''))).join('')}</div></div>`;
      case 'powerTarget':return boxCard(`⚡ ${CHARACTERS[me.char].name} — chọn mục tiêu (tung ${me.char==='franklin'?'d6':'d4'}):`,p.targets.map(id=>btn('btn-target',`UI.powerTarget('${id}')`,pl(id))).join(''));
      case 'spear':return boxCard('🔱 Giáo Longinus: đòn trúng! Lộ diện để +2 sát thương?',btn('btn-heal','UI.spearDecide(true)','👁️ Lộ diện, +2 sát thương')+btn('btn-ghost','UI.spearDecide(false)','Không'));
      case 'bob':return boxCard(`🎒 Bob: đòn sẽ gây ${p.dmg} sát thương cho ${pl(p.target)}. Cướp 1 trang bị thay vì đánh?`,s.players[p.target].equip.map((c,i)=>btn('btn-heal',`UI.bobDecide(${i})`,`Cướp "${esc(eqName(c))}"`)).join('')+btn('btn-target',"UI.bobDecide('dmg')",`Gây ${p.dmg} sát thương`));
      case 'counter':return boxCard(`🐺 Bạn bị ${pl(p.attacker)} tấn công. Phản đòn?`,btn('btn-target','UI.counterDecide(true)','🐺 Phản đòn ngay')+btn('btn-ghost','UI.counterDecide(false)','Không'));
      case 'loot':return boxCard(`🎒 Bạn hạ gục ${pl(p.victim)} — chọn 1 trang bị để lấy (số còn lại bị bỏ):`,s.players[p.victim].equip.map((c,i)=>btn('btn-heal',`UI.lootPick(${i})`,esc(eqName(c)))).join(''));
    }
    return '';
  }
  const steps=`<div class="steps"><span class="${s.step==='move'?'on':'done'}">1 · Di chuyển</span><span class="${s.step==='area'?'on':s.step==='attack'?'done':''}">2 · Khu vực</span><span class="${s.step==='attack'?'on':''}">3 · Tấn công</span></div>`;
  if(s.step==='move'){
    let html=steps;
    if((me.char==='franklin'||me.char==='george')&&me.revealed&&!me.usedPower)html+=btn('btn-heal','UI.usePower()',`⚡ Dùng năng lực trước khi đi (${me.char==='franklin'?'d6':'d4'} sát thương)`);
    html+=`<button class="btn-gold" onclick="UI.rollMove()" style="font-size:1.05rem;">🎲 Tung xúc xắc di chuyển${hasEq(me,'compass')?' (La Bàn: tung 2 lần)':''}</button>`;
    if(me.char==='emi'&&me.revealed&&me.area){const op=emiOptions(s,myId);html+=`<div class="muted small" style="margin:6px 0 2px;">Hoặc Emi dịch chuyển tới:</div><div class="row">${op.map(a=>btn('btn-ghost',`UI.emiMove('${a}')`,AREAS[a].name)).join('')}</div>`;}
    return `<div class="card">${html}</div>`;
  }
  if(s.step==='area'){const A=AREAS[me.area];return `<div class="card">${steps}<div class="small muted" style="margin-bottom:4px;">${A.name}: ${A.desc}</div><button class="btn-blue" onclick="UI.doArea()" style="width:100%;">${areaActionLabel(me.area)}</button><button class="btn-ghost" onclick="UI.skipArea()" style="width:100%;">Bỏ qua hành động khu</button></div>`;}
  if(s.step==='attack'){
    const tg=attackTargets(s,myId);let html=steps;
    if(!s.attacked){
      const forced=hasEq(me,'masamune')&&tg.length>0;
      if(tg.length){html+=`<div class="muted small" style="margin-bottom:4px;">⚔️ Mục tiêu trong tầm${hasEq(me,'handgun')?' (Súng Lục: mọi khu khác)':''}:</div>`;if(hasEq(me,'machinegun'))html+=btn('btn-target',"UI.attackTarget('all')",`🔫 Súng Máy: đánh tất cả (${tg.map(pl).join(', ')})`);else html+=`<div class="row">${tg.map(id=>btn('btn-target',`UI.attackTarget('${id}')`,'⚔️ '+pl(id))).join('')}</div>`;}
      else html+=`<div class="muted small">Không có ai trong tầm đánh.</div>`;
      html+=`<button class="btn-ghost" onclick="UI.noAttack()" style="width:100%;" ${forced?'disabled':''}>${forced?'Kiếm Masamune: bắt buộc tấn công':'Không tấn công'}</button>`;
    }else{
      if(me.char==='charles'&&me.revealed&&s.lastTargets&&s.lastTargets.some(x=>s.players[x].alive))html+=btn('btn-target','UI.charlesAgain()',`🩸 Tự chịu 2 máu, đánh lại ${s.lastTargets.filter(x=>s.players[x].alive).map(pl).join(', ')}`);
      if(me.char==='wight'&&me.revealed&&!me.usedPower&&s.deathOrder.length)html+=btn('btn-heal','UI.wightUse()',`🧟 Nhân Bản: thêm ${s.deathOrder.length} lượt`);
      html+=`<button class="btn-gold" onclick="UI.endTurn()">Kết thúc lượt ➡️</button>`;
    }
    return `<div class="card">${html}</div>`;
  }
  return '';
}
// ---- popup luật / thẻ ----
function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').hidden=false;}
function closeModal(){const m=$('modal');if(m)m.hidden=true;}
function showCard(cid){const C=CARDS[cid];if(!C)return;openModal(`${C.deck==='white'?'⬜':'⬛'} ${C.name}`,`<p class="muted">${C.type==='equip'?'Trang bị: luôn có hiệu lực, ai cũng thấy.':'Thẻ dùng 1 lần.'}</p><p>${esc(C.desc)}</p>`);}
function openRules(){
  let h=`<h3>Lượt chơi</h3><p>1. Di chuyển (bắt buộc): tung d6 + d4, tới khu có số đó. Tung 7 thì chọn khu bất kỳ khác khu đang đứng. Trùng khu đang đứng thì tung lại.</p><p>2. Hành động khu (tùy chọn).</p><p>3. Tấn công (tùy chọn, cuối lượt): chọn 1 người ở khu của bạn hoặc khu cặp với nó, tung d6 và d4, sát thương bằng hiệu 2 số; bằng nhau là trượt.</p><p>Hạ gục ai thì được lấy 1 trang bị của người đó (tự chọn), số còn lại bị bỏ. Ván kết thúc ngay khi có người đạt điều kiện thắng; nhiều người có thể cùng thắng, kể cả đã chết.</p><p>Lộ diện lúc nào cũng được (trừ Daniel). Năng lực chỉ dùng được sau khi lộ diện.</p>`;
  h+=`<h3>Khu vực</h3>`+AREA_IDS.map(a=>`<p><b>${AREAS[a].name}</b> (${AREAS[a].nums.join('/')}): ${AREAS[a].desc}</p>`).join('');
  h+=`<h3>Nhân vật</h3>`+Object.keys(CHARACTERS).map(k=>{const c=CHARACTERS[k];return `<p><b>${c.name}</b> · ${factionLabel(c.faction)} · ${c.hp} máu<br>Thắng: ${WINCOND[k]}<br>${c.power}</p>`;}).join('');
  h+=`<p class="muted">Số vai theo số người — 4: 2 Thợ Săn, 2 Bóng Tối · 5: 2/2/1 Trung Lập · 6: 2/2/2 · 7: 2/2/3 · 8: 3/3/2.</p>`;
  const deckList=(ids,title)=>{const cnt={};ids.forEach(i=>cnt[i]=(cnt[i]||0)+1);return `<h3>${title}</h3>`+Object.keys(cnt).map(i=>`<p><b>${CARDS[i].name}</b>${cnt[i]>1?' ×'+cnt[i]:''}${CARDS[i].type==='equip'?' <span class="muted">(trang bị)</span>':''}: ${CARDS[i].desc}</p>`).join('');};
  h+=deckList(WHITE_DECK,'Thẻ Trắng (16)')+deckList(BLACK_DECK,'Thẻ Đen (16)');
  const hc={};HERMIT_DECK.forEach(i=>hc[i]=(hc[i]||0)+1);
  h+=`<h3>Thẻ Ẩn Sĩ (16)</h3><p class="muted">Người rút đọc kín rồi đưa cho 1 người khác. Người nhận làm theo nếu trúng điều kiện, không thì "không có gì xảy ra". Cả hai không được tiết lộ nội dung thẻ.</p>`+Object.keys(hc).map(i=>`<p><b>${HERMIT[i].name}</b>${hc[i]>1?' ×'+hc[i]:''}: ${hermitText(i)}</p>`).join('');
  openModal('📖 Luật và thẻ',h);
}
function copyLink(){const url=location.origin+location.pathname+'#'+room;const p=(navigator.clipboard&&navigator.clipboard.writeText)?navigator.clipboard.writeText(url):Promise.reject();p.then(()=>pushToast('🔗 Đã sao chép link phòng: '+esc(url)),()=>prompt('Link phòng:',url));}
function confirmSkip(){if(confirm('Bỏ lượt hiện tại? Quyết định đang chờ sẽ được xử lý mặc định.'))UI.hostSkip();}
function confirmKick(id){if(confirm('Loại người này khỏi ván? Họ không tính là chết.'))UI.hostKick(id);}

// ================= KHỞI ĐỘNG =================
(function init(){
  if(!IS_BROWSER)return;
  const ni=$('nameInput'),ri=$('roomInput');if(!ni||!ri)return;
  ni.value=LS('sbt_name')||'';
  const hash=(location.hash||'').replace('#','').toUpperCase().replace(/[^A-Z0-9]/g,'');ri.value=hash||LS('sbt_room')||'';
  $('joinBtn').onclick=joinRoom;$('rulesBtn0').onclick=openRules;$('modalClose').onclick=closeModal;
  $('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
  [ni,ri].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom();}));
  render();connectMQTT();
  setTimeout(()=>{if(!connected)setSyncError(true);},9000);
})();
</script>
